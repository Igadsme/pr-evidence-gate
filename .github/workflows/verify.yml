name: PR Evidence Gate - verify
on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify PR evidence
        env:
          PR_EVIDENCE_OUTPUT: .tmp/evidence.json
        run: node dist/src/cli.js verify --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-evidence
          path: .tmp/evidence.json
          if-no-files-found: error
          retention-days: 5
